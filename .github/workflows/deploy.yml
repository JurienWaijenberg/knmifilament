name: 🚀 Deploy to TransIP

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: 🎉 Deploy to Shared Hosting
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: 📥 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install NPM dependencies
        run: npm ci

      - name: 🔨 Build assets
        run: npm run build

      - name: 🔧 Generate service provider cache
        run: php artisan package:discover --ansi

      - name: 🗑️ Clean up unnecessary files
        run: |
          rm -rf node_modules

      - name: 📂 Install lftp for SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 📂 Test SFTP connection
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "🔌 Testing SFTP connection..."
          lftp -c "
          set sftp:auto-confirm yes
          set sftp:connect-program 'ssh -a -x -oStrictHostKeyChecking=no'
          set net:timeout 30
          open -u $SFTP_USER,$SFTP_PASS sftp://$SFTP_SERVER
          pwd
          quit
          " || (echo "❌ Connection test failed!" && exit 1)

      - name: 📂 Create directory if needed
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "📁 Ensuring directory structure exists..."
          lftp -c "
          set sftp:auto-confirm yes
          set sftp:connect-program 'ssh -a -x -oStrictHostKeyChecking=no'
          set net:timeout 30
          open -u $SFTP_USER,$SFTP_PASS sftp://$SFTP_SERVER
          pwd
          mkdir /subsites
          cd /subsites
          mkdir knmi.waijenbergmedia.nl
          cd knmi.waijenbergmedia.nl
          pwd
          quit
          " 2>&1 | grep -v "already exists" || true

      - name: 📂 Sync files to server via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          echo "📤 Starting file sync to $SFTP_DIR..."
          lftp -c "
          set sftp:auto-confirm yes
          set sftp:connect-program 'ssh -a -x -oStrictHostKeyChecking=no'
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          open -u $SFTP_USER,$SFTP_PASS sftp://$SFTP_SERVER
          mkdir /subsites
          cd /subsites
          mkdir knmi.waijenbergmedia.nl
          cd knmi.waijenbergmedia.nl
          mirror --reverse \
            --delete \
            --only-newer \
            --ignore-time \
            --verbose \
            --parallel=5 \
            --exclude-glob .git* \
            --exclude-glob node_modules \
            --exclude-glob .env* \
            --exclude-glob tests \
            --exclude-glob storage/logs/* \
            --exclude-glob storage/framework/cache/* \
            --exclude-glob storage/framework/sessions/* \
            --exclude-glob storage/framework/views/* \
            --exclude-glob bootstrap/cache/config.php \
            --exclude-glob bootstrap/cache/routes-*.php \
            --exclude-glob .idea \
            --exclude-glob .vscode \
            --exclude-glob *.md \
            --exclude-glob .gitignore \
            --exclude-glob .env.example \
            --exclude-glob phpunit.xml \
            --exclude-glob .phpunit.result.cache \
            --exclude-glob .github \
            --exclude-glob .bashrc \
            --exclude-glob .crontab \
            --exclude-glob .webhosting* \
            --exclude-glob logs* \
            --exclude-glob subsites* \
            --exclude-glob tmp* \
            --exclude-glob www* \
            --exclude-glob settings* \
            --exclude-glob sshauthsocket*
          quit
          " || (echo "❌ SFTP sync failed!" && exit 1)
          echo "✅ File sync completed successfully!"
